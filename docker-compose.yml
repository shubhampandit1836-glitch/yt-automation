services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m backend.app.workers.runtime
    env_file: .env
    volumes:
      - app-data:/app/data
    depends_on: [api]
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m backend.app.scheduler
    env_file: .env
    volumes:
      - app-data:/app/data
    depends_on: [api]

volumes:
  app-data:
